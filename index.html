<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#126b60"><link rel="manifest" href="manifest.json"><title>Shadow English</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#18332f;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px 16px 230px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;letter-spacing:-1px}h2{font-size:25px;margin:8px 0}small,.muted{color:#62746f}section{background:white;border:1px solid #dce7e3;border-radius:18px;padding:20px;margin:16px 0}button,select{font:inherit;color:inherit;border:1px solid #d5e2de;border-radius:10px;background:white;padding:10px;cursor:pointer}button:disabled{opacity:.4}button.on,button.primary{background:#126b60;color:white;border-color:#126b60} .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.spread{justify-content:space-between}.line{display:block;width:100%;text-align:left;border:0;padding:16px 12px;margin:4px 0;font-size:19px;line-height:1.55}.line.active{background:#e0f3ed;border-left:4px solid #126b60}.translation{display:block;font-size:14px;color:#62746f;margin-top:5px}.player{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce7e3;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:2}.player>div{max-width:688px;margin:auto}.center{justify-content:center}progress{width:100%;accent-color:#126b60;height:8px}#status{font-size:13px;min-height:20px}textarea{width:100%;min-height:90px;font:inherit;border:1px solid #d5e2de;border-radius:10px;padding:10px}audio{width:100%}label{font-size:14px} .stat{font-size:23px;font-weight:700} [hidden]{display:none!important}a{color:#126b60}#prepStatus,#sourceInfo{font-size:14px}details{margin:12px 0}#humanTools input{max-width:100%} .line small{display:block}</style></head><body><main><header><h1>Shadow English <small>0.2</small></h1><small id="date"></small></header><section class="row spread"><div><small>学習した日数</small><div class="stat" id="days">0日</div></div><div><small>累計練習時間</small><div class="stat" id="mins">0分</div></div><div><small>今日</small><div id="done">未完了</div></div></section><section><div class="row spread"><small>DAILY LESSON</small><select id="lesson" aria-label="教材選択"></select></div><h2 id="title"></h2><p class="muted" id="topic"></p><p id="sourceInfo"></p><div id="humanTools" hidden><p class="muted">原文の冒頭を表示しています。全文は出典ページの Conversation からコピーして貼り付けられます。人間音声の文同期は手動で設定します。</p><details><summary>全文・文頭時刻を設定</summary><textarea id="humanText" placeholder="英文を1文ずつ改行して貼り付け"></textarea><button id="applyText">スクリプトを保存</button><p class="muted">音声を文頭まで移動してから「文頭を記録」を押します。</p><button id="markTime">選択文の文頭を記録</button></details><label>音声ファイルを読み込む（外部音声が再生できない場合） <input id="localAudio" type="file" accept="audio/*"></label></div><div id="aiTools"><p class="muted">Kokoroニューラル音声。初回はモデルのダウンロードが必要です。</p><button id="prepare" class="primary">AI音声を準備</button><p id="prepStatus" role="status"></p></div><div class="row" id="modes"><button data-mode="listen" class="on">リスニング</button><button data-mode="shadow">シャドーイング</button></div><p id="tip" class="muted">英文を目で追いながら音声を聞きましょう。</p></section><section><div class="row spread"><b>スクリプト</b><select id="display" aria-label="スクリプト表示"><option value="en">英文のみ</option><option value="both">英文＋和訳</option><option value="off">非表示</option></select></div><div id="script"></div></section><section id="recordSection"><b>録音・聞き比べ</b><p class="muted">お手本を聞いた後、自分の声を録音して比較できます。</p><div class="row"><button id="record">● 録音開始</button><button id="stopRecord" disabled>録音終了</button></div><p id="recStatus" role="status"></p><audio id="recorded" controls hidden></audio></section><section><button class="primary" id="complete">今日の学習を完了</button><p class="muted">記録はこのブラウザ内に保存されます。</p></section></main><div class="player"><div><audio id="media" controls preload="metadata" hidden></audio><progress id="progress" value="0" max="4"></progress><div class="row center"><button id="prev" aria-label="前の文">⏮</button><button id="play" class="primary">▶ 再生</button><button id="next" aria-label="次の文">⏭</button><button id="repeat" aria-pressed="false">↻ 反復</button></div><div class="row spread" style="margin-top:8px"><label>速度 <select id="speed"><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select> ×</label><label>音声 <select id="voice" style="max-width:155px"><option value="af_heart">米国・女性 Heart</option><option value="am_michael">米国・男性 Michael</option><option value="bf_emma">英国・女性 Emma</option></select></label></div><div id="status" role="status"></div></div></div><script src="lessons.js"></script><script src="app.js?v=2"></script></body></html>
